const BR_OUT=[[-60.7,5.2],[-59.8,4.4],[-58.6,1.9],[-56.4,1.9],[-54.2,2.3],[-51.6,4.3],[-50.4,1.8],[-49.9,-0.3],[-48.4,-1],[-44.4,-2.4],[-41.5,-2.9],[-38.5,-3.7],[-36.3,-5],[-35.2,-5.5],[-34.8,-7.2],[-35.2,-9],[-37,-11],[-38.5,-13],[-39,-15.5],[-39.6,-18.1],[-40.3,-20.3],[-41,-22],[-43.2,-23],[-45,-23.7],[-46.3,-24],[-48,-25.3],[-48.6,-26.5],[-48.6,-28.4],[-49.8,-29.3],[-51,-30.6],[-52.1,-32.2],[-53.4,-33.7],[-53.6,-32.5],[-55.6,-30.9],[-57.6,-30.2],[-55.8,-28],[-54.2,-27.1],[-54.6,-25.6],[-54.3,-24],[-55.6,-23.9],[-57.9,-22.1],[-58.1,-19.8],[-57.5,-17.5],[-60.2,-16.3],[-60.4,-13.5],[-62,-12.5],[-65.4,-11],[-66.8,-9.8],[-69.5,-11],[-72.5,-9.5],[-73.9,-7.5],[-73,-5],[-70,-4.2],[-69.4,-1],[-69.9,1],[-67,2],[-64.2,2],[-64,4],[-60.7,5.2]];
const brX=lon=>(lon+75)*10,brY=lat=>(6-lat)*10;
const UFS={
  SP:{n:"São Paulo",lon:-47.2,lat:-22.6},RJ:{n:"Rio de Janeiro",lon:-43.2,lat:-22.9},MG:{n:"Minas Gerais",lon:-44.2,lat:-19.2},
  RS:{n:"Rio Grande do Sul",lon:-51.6,lat:-29.6},PR:{n:"Paraná",lon:-50.6,lat:-24.9},BA:{n:"Bahia",lon:-40.5,lat:-12.8}
};
const CLASSICOS=[
  {uf:"SP",nome:"Derby Paulista",a:"cor",b:"pal",tx:"O maior clássico de São Paulo, disputado desde 1917. De um lado o Timão, o time do povo; do outro o antigo Palestra Itália, fundado por imigrantes italianos. Cidade parada e estádio dividido."},
  {uf:"SP",nome:"Choque-Rei",a:"pal",b:"sao",tx:"Palmeiras e São Paulo, dois gigantes da capital que decidiram muitos Paulistões e Brasileirões. Jogo de muita tática e pouca margem de erro."},
  {uf:"SP",nome:"Majestoso",a:"cor",b:"sao",tx:"Corinthians contra São Paulo, o clássico de nome nobre. A Fiel contra o Tricolor do Morumbi em finais históricas, inclusive de Libertadores."},
  {uf:"SP",nome:"San-São",a:"san",b:"sao",tx:"Santos contra São Paulo, o clássico que ficou famoso na era de Pelé, quando o Peixe enchia o Morumbi e a Vila."},
  {uf:"SP",nome:"Clássico da Saudade",a:"pal",b:"san",tx:"Lembra os anos 1960, quando a Academia do Palmeiras e o Santos de Pelé eram os melhores times do Brasil e se revezavam nos títulos."},
  {uf:"SP",nome:"Clássico Alvinegro",a:"cor",b:"san",tx:"Preto e branco dos dois lados: o Timão da capital contra o Peixe do litoral, com muita história em finais de Paulistão."},
  {uf:"SP",nome:"Duelo do Interior",a:"rbb",b:"mir",tx:"Não é um clássico antigo, mas é o encontro dos dois times do interior paulista na Série A: o Massa Bruta de Bragança contra o Leão de Mirassol."},
  {uf:"RJ",nome:"Fla-Flu",a:"fla",b:"flu",tx:"Nasceu em 1912, quando jogadores do Fluminense saíram do clube e foram fundar o futebol do Flamengo. Nelson Rodrigues dizia: \"O Fla-Flu começou quarenta minutos antes do nada\"."},
  {uf:"RJ",nome:"Clássico dos Milhões",a:"fla",b:"vas",tx:"As duas maiores torcidas do Rio frente a frente. Maracanã lotado, rubro-negro de um lado e cruz-maltino do outro."},
  {uf:"RJ",nome:"Clássico Vovô",a:"bot",b:"flu",tx:"O clássico mais antigo do Rio, jogado desde o começo do século 20. Por isso o apelido de vovô dos clássicos cariocas."},

  {uf:"RJ",nome:"Clássico dos Gigantes",a:"vas",b:"flu",tx:"Vasco e Fluminense, dois gigantes cariocas com finais históricas de Campeonato Carioca."},

  {uf:"MG",nome:"Clássico Mineiro",a:"cam",b:"cru",tx:"Galo contra Raposa, o jogo que divide Belo Horizonte ao meio. Clássico de Mineirão cheio e muita provocação."},

  {uf:"BA",nome:"Ba-Vi",a:"bah",b:"vit",tx:"O maior clássico do Nordeste: Bahia contra Vitória em Salvador, com a Fonte Nova ou o Barradão pegando fogo."}
];
let CQ={uf:null,i:null};
const LBL={SP:[6,34],RJ:[32,5],PR:[-34,5],RS:[-34,5]};
const dotC=k=>{const c=CLUBS[k];return /^#(fff|ffffff|f[0-9a-f]f[0-9a-f]f[0-9a-f])$/i.test(c.c1)?c.c2:c.c1;};
function brMap(){
  const pts=BR_OUT.map(([x,y])=>`${brX(x).toFixed(0)},${brY(y).toFixed(0)}`).join(" ");
  const pins=Object.entries(UFS).map(([k,u])=>{const n=CLASSICOS.filter(c=>c.uf===k).length,x=brX(u.lon),y=brY(u.lat),on=CQ.uf===k;
    return `<g class="pin ${on?"on":""}" data-act="q-uf" data-uf="${k}" role="button" tabindex="0" aria-label="${u.n}: ${n} clássicos"><circle cx="${x}" cy="${y}" r="${on?20:16}"/><text x="${x}" y="${y+5}" text-anchor="middle">${n}</text><text class="uf" x="${x+(LBL[k]||[0,-24])[0]}" y="${y+(LBL[k]||[0,-24])[1]}" text-anchor="middle">${k}</text></g>`;}).join("");
  return `<svg class="brmap" viewBox="0 0 420 405" role="img" aria-label="Mapa do Brasil com os clássicos"><polygon points="${pts}" class="br"/>${pins}</svg>`;
}
function showClassicos(){
  G=null;ASK=null;TREINO=false;ensureShell();document.getElementById("screen").innerHTML="";

  <p>O Brasil é cheio de clássico! Toque num estado do mapa pra ver os clássicos de lá. O treino não vale essências.</p>
  <div class="mapwrap">${brMap()}</div>
  <h3 class="sub">${CQ.uf?`${UFS[CQ.uf].n} <button type="button" class="chip" data-act="q-uf" data-uf="">Ver todos</button>`:"Todos os clássicos"}</h3>
  <div class="qlist">${list.map(([c,i])=>`<button type="button" class="qc" data-act="q-pick" data-i="${i}" style="--c1:${dotC(c.a)};--c2:${dotC(c.b)}"><i></i><span><b>${c.nome}</b><small>${CLUBS[c.a].name} x ${CLUBS[c.b].name} · ${c.uf}</small></span></button>`).join("")}</div>
  <div class="row"><button class="btn s" data-act="q-livre">Jogo livre (qualquer time)</button><button class="btn s" data-act="newgame">Voltar ao menu</button></div></div>`);
}
function showClassico(i){
  const c=CLASSICOS[i],A=CLUBS[c.a],B=CLUBS[c.b];

  <p><b style="color:var(--fg)">${A.name}</b> x <b style="color:var(--fg)">${B.name}</b> · ${UFS[c.uf].n}</p>
  <p>${c.tx}</p>
  <h3 class="sub">Com quem você joga?</h3>
  <div class="modes">${[[c.a,c.b],[c.b,c.a]].map(([me,ai])=>`<button type="button" class="mode" data-act="q-play" data-me="${me}" data-ai="${ai}" style="border-left:6px solid ${CLUBS[me].c1}"><b>${CLUBS[me].name}</b><small>${CLUBS[me].coach.name}: ${CLUBS[me].coach.power}</small></button>`).join("")}</div>
  <div class="row"><button class="btn s" data-act="m-treino">Voltar ao mapa</button></div></div>`);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act^='q-']");if(!el)return;

  if(a==="q-uf"){CQ.uf=el.dataset.uf||null;return showClassicos();}
