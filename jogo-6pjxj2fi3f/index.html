<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1510"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Brasileirão Cards">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icone-192.png"><link rel="apple-touch-icon" href="icone-180.png">
<title>Brasileirão Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: uma "tela de celular" em pé, centralizada no PC (no celular de verdade ocupa a tela toda). De cima pra baixo: placar, rival (linha de trás, linha da frente), faixa de narração, você (frente, trás), sua mão e barra de ações. Tocar numa carta abre uma gaveta com a carta grande e o que dá pra fazer com ela. */
:root{
  color-scheme:dark;
  --bg:#0B1510; --phone:#10201A; --pitch:#174029; --pitch2:#1B4A30; --line:rgba(255,255,255,.16);
  --panel:#13231B; --panel2:#1B3027; --fg:#EEF4EE; --muted:#9DB3A6; --gold:#FFD84D; --pink:#FF7FA8;
  --mine:#4CC27A; --theirs:#FF6B6B; --ink:#3B2A5C;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-card:"Baloo 2",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.35;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;padding-inline:16px;padding-block:16px}
.phone{position:relative;width:min(100%,400px);height:min(860px,calc(100dvh - 32px));min-height:640px;background:var(--phone);border:10px solid #050A07;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
@media (max-width:460px){.stage{padding:0}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0}}
.tag{position:fixed;left:16px;bottom:12px;color:var(--muted);font-size:12px;max-width:260px}
@media (max-width:900px){.tag{display:none}}

/* placar */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;background:#0A1611;border-bottom:1px solid var(--line)}
.top .sc{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:15px;flex:1;min-width:0}
.top .sc i{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.6)}
.top .sc .n{background:#000;border-radius:6px;padding:0 8px;font-size:20px;font-variant-numeric:tabular-nums}
.top .sc span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ck{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:16px;font-variant-numeric:tabular-nums}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:15px;flex:none}

/* campo */
.field{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:6px 8px;background:repeating-linear-gradient(180deg,var(--pitch) 0 44px,var(--pitch2) 44px 88px)}
.side{display:flex;flex-direction:column;gap:4px}
.lineLbl{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:rgba(255,255,255,.65);padding:0 2px}
.lineLbl b.ai{color:var(--theirs)}.lineLbl b.me{color:var(--mine)}
.ln{display:flex;justify-content:center;gap:6px}
.ln.back .fc{width:84px;height:92px}
.ln.back .fc .art{height:44px}
.ticker{background:rgba(0,0,0,.45);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--fg);display:flex;gap:8px;align-items:center;min-height:42px}
.ticker .gl{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.ticker .gl.open{background:var(--theirs);color:#2A0606}.ticker .gl.closed{background:rgba(255,255,255,.12);color:var(--muted)}
.ticker .lt{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* carta de campo compacta */
.fc{width:112px;height:128px;border-radius:10px;padding:3px;position:relative;flex:none;background:linear-gradient(135deg,#FFB3D9 0%,#C9B6FF 35%,#A8F0FF 65%,#FFF1A8 100%);border:2px solid var(--ink);color:#2A1F45;font-family:var(--f-card);text-align:left;display:block}
.fc .in{background:#FFF;border-radius:7px;height:100%;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid var(--ink)}
.fc .hd{display:flex;justify-content:space-between;align-items:center;padding:1px 4px 0;gap:2px}
.fc .nm{font-weight:800;font-size:11px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fo{font-weight:800;font-size:12px;color:#E23B7A;font-variant-numeric:tabular-nums;flex:none}
.fc .art{flex:none;height:64px;margin:1px 4px 0;border-radius:4px;border:1.5px solid var(--ink);overflow:hidden;background:radial-gradient(circle at 50% 120%,#8FD694 0 42%,transparent 43%),linear-gradient(180deg,#FFE3F1 0%,#D9E8FF 100%)}
.fc .art svg{width:100%;height:100%;display:block}
.fc .ft{display:flex;align-items:center;gap:2px;padding:2px 4px;flex-wrap:wrap;min-height:18px}
.fc .ro{font-size:11px}
.fc .bar{height:4px;margin:2px 4px 0;background:#F1D6E2;border-radius:2px;overflow:hidden}.fc .bar i{display:block;height:100%;background:#E23B7A}
.fc.sel{box-shadow:0 0 0 3px var(--pink),0 0 16px rgba(255,127,168,.6)}
.fc.ready{box-shadow:0 0 0 2px var(--gold)}
.slot{width:112px;height:128px;border:2px dashed rgba(255,255,255,.25);border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:11px;text-align:center;padding:4px;flex:none;background:transparent}
.ln.back .slot{width:84px;height:92px}
.e{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;font:800 8px/1 var(--f-body);color:#fff;border:1px solid rgba(0,0,0,.35);flex:none}
.e.G{background:#D9481C}.e.T{background:#2563C9}.e.V{background:#E2A500;color:#231A00}.e.C{background:#8B8B9A}
.bf{font-size:9px;font-weight:800;background:#FFD84D;color:#3A2600;border-radius:4px;padding:0 3px}

/* mão */
.handBar{background:#0A1611;border-top:1px solid var(--line);padding:6px 8px 4px}
.handBar .hl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 2px 4px}
.handBar .hl b{color:var(--gold);font-weight:700}
.hand{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity}
.hc{width:72px;height:96px;flex:none;border-radius:8px;border:2px solid var(--ink);padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;text-align:center;font-family:var(--f-card);color:#2A1F45;scroll-snap-align:start;background:#FFF}
.hc .k{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#6B5E8C}
.hc .nm{font-weight:800;font-size:10px;line-height:1.05;max-height:22px;overflow:hidden}
.hc .mini{width:100%;height:44px;border-radius:4px;overflow:hidden;background:linear-gradient(180deg,#FFE3F1,#D9E8FF)}
.hc .mini svg{width:100%;height:100%}
.hc .ic{font-size:26px;line-height:1.2}
.hc.player{background:linear-gradient(135deg,#FFB3D9,#C9B6FF 40%,#A8F0FF 70%,#FFF1A8)}
.hc.event{background:linear-gradient(135deg,#FFE680,#FFB36B)}.hc.stadium{background:linear-gradient(135deg,#7FD1FF,#5B8CFF)}.hc.reaction{background:linear-gradient(135deg,#FF9AA8,#C86BFF)}
.hc.energy .big{width:34px;height:34px;font-size:15px;margin-top:6px}
.hc.dim{opacity:.55}
.actions{display:flex;gap:6px;padding:6px 8px 10px;background:#0A1611}
.actions button{flex:1;border:0;border-radius:12px;padding:11px 8px;font-weight:800;font-size:14px}
.actions .end{background:var(--gold);color:#231A00}
.actions .end:disabled{opacity:.4;cursor:not-allowed}
.actions .sec{background:var(--panel2);color:var(--fg);border:1px solid var(--line);flex:0 0 auto;padding-inline:14px}
.turnPill{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:4;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:3px 10px;pointer-events:none}
.turnPill.me{background:var(--mine);color:#06140C}.turnPill.ai{background:var(--theirs);color:#2A0606}.turnPill.setup{background:var(--gold);color:#231A00}

/* gaveta */
.sheetWrap{position:absolute;inset:0;background:rgba(3,8,5,.6);display:flex;align-items:flex-end;z-index:10}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:10px;align-items:flex-start}
.btns{display:flex;flex-direction:column;gap:6px}
.ab{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg)}
.ab b{display:block}.ab small{display:block;color:var(--muted);font-size:12px}
.ab strong{font-family:var(--f-display);font-size:20px}
.ab.pri{background:var(--gold);color:#231A00;border-color:var(--gold)}.ab.pri small{color:#5A4500}
.ab:disabled{opacity:.45;cursor:not-allowed}
.ab .e{width:18px;height:18px;font-size:10px}
.close{align-self:stretch;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--muted);font-weight:700}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log li{border-left:3px solid var(--line);padding-left:8px;color:var(--muted)}
.log li.me{border-color:var(--mine);color:var(--fg)}.log li.ai{border-color:var(--theirs);color:var(--fg)}.log li.big{color:var(--gold);font-weight:700}

/* carta grande (gaveta) */
.cm{width:150px;height:208px;border-radius:12px;padding:5px;flex:none;color:#2A1F45;font-family:var(--f-card);background:linear-gradient(135deg,#FFB3D9 0%,#C9B6FF 35%,#A8F0FF 65%,#FFF1A8 100%);border:2px solid var(--ink);text-align:left}
.cm .in{background:#FFF;border-radius:8px;height:100%;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid var(--ink)}
.cm .hd{display:flex;justify-content:space-between;align-items:center;padding:2px 5px 0;gap:4px}
.cm .st{font-weight:800;font-size:8px;background:var(--ink);color:#FFD6EE;border-radius:4px;padding:0 4px;white-space:nowrap}
.cm .st.Cria{background:#2F8F4E;color:#E4FFE9}.cm .st.Ídolo{background:#B8860B;color:#FFF6D6}
.cm .fo{font-weight:800;font-size:12px;color:#E23B7A}
.cm .nm{font-weight:800;font-size:13px;line-height:1.05;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .art{margin:2px 5px 0;height:66px;border-radius:5px;border:1.5px solid var(--ink);overflow:hidden;background:radial-gradient(circle at 50% 120%,#8FD694 0 42%,transparent 43%),linear-gradient(180deg,#FFE3F1 0%,#D9E8FF 100%)}
.cm .art svg{width:100%;height:100%;display:block}
.cm .ps{display:flex;justify-content:space-between;font-size:9px;font-weight:700;padding:1px 5px;margin:2px 5px 0;border-radius:4px}
.cm .ps.role-T{background:#DDEBFF}.cm .ps.role-S{background:#F3E8FF}.cm .ps.role-C{background:#FFE4E4}
.cm .mv{padding:2px 5px;display:flex;flex-direction:column;gap:1px;flex:1;min-height:0}
.cm .mv div{display:grid;grid-template-columns:auto 1fr auto;gap:3px;align-items:center;font-size:9.5px;font-weight:700;line-height:1.1}
.cm .hb{font-size:9px;font-weight:800;color:#7A4A00;background:#FFF1A8;border-radius:6px;padding:1px 5px;margin:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habx{background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:7px 10px;margin:6px 0;font-size:13px}.habx b{color:var(--gold)}
.cm .mv strong{font-size:12px}.cm .mv em{font-style:normal;color:#B23A48}
.cm .en{display:flex;gap:2px;padding:0 5px 3px;min-height:15px;flex-wrap:wrap}
.cm.energy .in{align-items:center;justify-content:center;gap:6px;text-align:center}
.cm.energy .big{width:70px;height:70px;font-size:30px;border-width:3px}
.cm.event{background:linear-gradient(135deg,#FFE680,#FFB36B)}.cm.stadium{background:linear-gradient(135deg,#7FD1FF,#5B8CFF)}.cm.reaction{background:linear-gradient(135deg,#FF9AA8,#C86BFF)}
.cm .tp{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 6px 0;color:#6B5E8C}
.cm .ic{font-size:40px;text-align:center;line-height:1.3}
.cm .tx{font-size:10.5px;font-weight:600;padding:2px 7px;line-height:1.2;color:#3A2F55}

/* janelas */
.ov{position:absolute;inset:0;background:rgba(4,10,7,.82);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-height:100%;overflow-y:auto}
.dlg h2{margin:0 0 8px;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;text-wrap:balance}
.dlg p,.dlg li{color:var(--muted)}
.dlg ol{padding-left:18px;margin:0}.dlg li{margin-bottom:4px}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800}
.btn.p{background:var(--gold);color:#231A00}.btn.s{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.pick{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pick button{border-radius:14px;padding:14px;border:2px solid var(--line);background:var(--panel2);text-align:left}
.pick b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;display:block}
.pick small{color:var(--muted)}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:30;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:56px;color:var(--gold);text-shadow:0 4px 0 #000,0 0 30px rgba(255,216,77,.5);pointer-events:none;white-space:nowrap}
.coin{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:30;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF3B0,#E2A500 60%,#9A6B00);border:5px solid #6B4A00;font-family:var(--f-display);font-weight:700;font-size:20px;color:#3A2600;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){
  .coin.spin{animation:spin .6s ease-out}
  @keyframes spin{from{transform:translate(-50%,-50%) rotateY(0)}to{transform:translate(-50%,-50%) rotateY(1080deg)}}
  .toast{animation:pop .9s ease-out}
  @keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}30%{transform:translateX(-50%) scale(1.1);opacity:1}100%{transform:translateX(-50%) scale(1)}}
  .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
}

.clubs{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.cl{display:flex;gap:4px}
.cl .go{flex:1;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border-radius:12px;padding:8px 10px;border:1px solid var(--line);background:var(--panel2)}
.cl .go i{grid-row:span 2;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);border:1.5px solid rgba(255,255,255,.6)}
.cl .go b{font-family:var(--f-display);font-size:17px;text-transform:uppercase}
.cl .go small{color:var(--muted);font-size:12px}
.cl .inf{width:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:16px}
.ann{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:rgba(4,10,7,.55);pointer-events:none}
.annIn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px}
.annT{background:var(--theirs);color:#2A0606;font-weight:800;border-radius:999px;padding:6px 14px;text-align:center;max-width:320px}
@media (prefers-reduced-motion:no-preference){.annIn{animation:pop .5s ease-out}}
.pw{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.pw b{font-family:var(--f-display);text-transform:uppercase;font-size:16px}.pw span{color:var(--gold);font-weight:700}.pw small{color:var(--muted)}
/* molduras por estágio (mesmas cores da galeria de arte) */
.f-titular{background:linear-gradient(180deg,#FFE680 0%,#FFD23F 100%)}
.f-cria{background:linear-gradient(180deg,#B9F0A8 0%,#5DBB63 100%)}
.f-idolo{background:linear-gradient(135deg,#FFB3D9 0%,#C9B6FF 35%,#A8F0FF 65%,#FFF1A8 100%)}
.hc.player.f-titular,.hc.player.f-cria,.hc.player.f-idolo{border-color:var(--ink)}
.fc{height:132px;width:106px}.fc .art{height:70px}
.ln.back .fc{height:90px;width:80px}.ln.back .fc .art{height:42px}
.slot{height:132px;width:106px}.ln.back .slot{height:90px;width:80px}
.field{overflow-y:auto}
.cm .art{height:80px}

/* modo coleção */
html,body{overscroll-behavior:none}
.essbar{display:flex;gap:10px;flex-wrap:wrap;background:#0A1611;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px 0 10px;font-size:13px}
.essbar b{color:var(--gold);font-family:var(--f-display);font-size:17px}
.sub{font-family:var(--f-display);text-transform:uppercase;font-size:17px;margin:14px 0 4px}.sub small{color:var(--muted);text-transform:none;font-family:var(--f-body);font-size:12px}
.pkbig{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#2B1D5C,#123A2A);border:1px solid var(--line);border-radius:14px;padding:12px}
.pkbig small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pkimg{font-size:40px;filter:drop-shadow(0 0 10px rgba(255,216,77,.5))}
.cg{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:6px;justify-content:center;margin:6px 0}
.pkrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.pkback{width:72px;height:96px;border-radius:8px;border:2px solid var(--gold);background:repeating-linear-gradient(45deg,#2B1D5C 0 8px,#3B2A7C 8px 16px);display:grid;place-items:center;font-size:30px;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-3px) rotate(-2deg)}}
.flipin{animation:flipin .45s ease-out}
@keyframes flipin{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
.hc{position:relative}
.hc.star{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,216,77,.7)}
.hc .bdg{position:absolute;top:-6px;right:-6px;font-size:9px;font-weight:800;border-radius:8px;padding:1px 5px;background:var(--mine);color:#002B12;font-family:var(--f-body)}
.hc .bdg.dup{background:var(--gold);color:#231A00}
.hc.miss{background:var(--panel2);border:2px dashed var(--line);color:var(--muted);justify-content:center}
.hc.miss .q{font-size:28px;font-family:var(--f-display)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;border-left:4px solid var(--c1,var(--line))}
.chip.on{background:var(--gold);color:#231A00}
.warn{color:var(--pink)!important;font-size:12px}.okk{color:var(--mine)!important;font-weight:700}
.btn:disabled{opacity:.45}

/* ================== HABILIDADES ==================
   Cada jogador tem 1 habilidade única (vinda da thread "Personalizar habilidades").
   HAB[key] = [quando, efeito, valor, nome, texto]. Os gatilhos chamam habFire(),
   e os efeitos "enquanto..." entram nas contas de ataque e de dano. */
const hab=p=>p&&p.def&&p.def.kind==="player"?HAB[p.def.key]:null;
const habIs=(p,q,e)=>{const h=hab(p);return !!h&&h[0]===q&&(!e||h[1]===e);};
const habLog=(s,p,txt)=>log(`✨ ${p.def.name} (${hab(p)[3]}): ${txt}`,s);
const half_=p=>p.dmg*2>=p.def.hp;
/* bônus de ataque que vem das habilidades */
function habBonus(s,p){
  let b=0;const h=hab(p);
  if(h&&h[1]==="fo"){
    if(h[0]==="pr"&&!p.atk1)b+=h[2];
    if(h[0]==="me"&&half_(p))b+=h[2];
    if(h[0]==="fi"&&G.half>=16)b+=h[2];
  }
  for(const q of back(s))if(q!==p&&habIs(q,"tr","px"))b+=hab(q)[2];
  return b;
}
/* quanto de dano a habilidade segura */
function habShield(o,t){
  let r=0;const h=hab(t),fr=inFront(o,t);
  if(h&&h[1]==="es"&&((h[0]==="fr"&&fr)||(h[0]==="me"&&half_(t))))r+=h[2];
  if(fr){
    for(const q of front(o))if(habIs(q,"fr","et"))r+=hab(q)[2];
    for(const q of back(o))if(habIs(q,"tr","et"))r+=hab(q)[2];
  }
  return r;
}
function enType(s,p){
  for(const m of p.def.moves){const mi=missing(p,m).find(x=>x!=="C");if(mi)return mi;}
  return CLUBS[T_(s).club].main||"T";
}
function searchEvent(s,p){
  const T=T_(s),i=T.deck.findIndex(c=>c.def.kind!=="player"&&c.def.kind!=="energy");
  if(i<0){habLog(s,p,"procurou um evento, mas não tem mais nenhum no baralho.");return;}
  const [c]=T.deck.splice(i,1);T.hand.push(c);shuffle(T.deck);
  habLog(s,p,s==="me"||G.online?`pegou ${c.def.name} do baralho.`:"pegou um evento do baralho.");
}
function habDraw(s,p,n){const T=T_(s);for(let i=0;i<n;i++)draw(T);habLog(s,p,`${nm(s)} compra ${n} carta${n>1?"s":""}.`);}
function habEnergy(s,p,n){const t=enType(s,p);for(let i=0;i<n;i++)p.en.push({def:{kind:"energy",type:t,name:EN[t]}});habLog(s,p,`ganha ${n} energia de ${EN[t]}.`);}
function habHeal(s,p,n){if(!p.dmg)return;const v=Math.min(p.dmg,n);p.dmg-=v;habLog(s,p,`recupera ${v} de vida.`);}
function habBuff(s,p,n){p.buff=(p.buff||0)+n;habLog(s,p,`o próximo ataque dele bate +${n}.`);}
async function habMate(s,p,n){
  const sug=fieldOf(s).filter(x=>x!==p).sort((a,b)=>(a.def.role==="C"?0:1)-(b.def.role==="C"?0:1)||(inFront(s,b)-inFront(s,a)))[0];
  const m=sug&&await chooseMate(s,fieldOf(s).filter(x=>x!==p),sug,`✨ ${p.def.name}: ${hab(p)[3]}`,`+${n} no próximo ataque. Pra quem?`);
  if(!m)return;m.buff=(m.buff||0)+n;habLog(s,p,`${m.def.name} bate +${n} no próximo ataque.`);
}
/* tira vida de um rival da frente (o mais machucado). Derrubou, é gol. */
async function habDmg(s,p,n){
  const o=other(s),t=[...front(o)].sort((a,b)=>(a.def.hp-a.dmg)-(b.def.hp-b.dmg))[0];
  if(!t||G.over)return;
  t.dmg+=n;habLog(s,p,`tira ${n} de vida de ${t.def.name}.`);
  if(t.dmg>=t.def.hp)await down(o,t,s,p);
}
/* efeitos que não dependem de um alvo */
async function habApply(s,p,e,v,ctx){
  ctx=ctx||{};
  if(e==="cp")return habDraw(s,p,v||1);
  if(e==="en")return habEnergy(s,p,v||1);
  if(e==="cu")return habHeal(s,p,v);
  if(e==="fo")return habBuff(s,p,v);
  if(e==="px")return habMate(s,p,v);
  if(e==="dd"||e==="dv"&&!ctx.from)return habDmg(s,p,v);
  if(e==="be")return searchEvent(s,p);
  if(e==="tg"){const T=T_(s);T.swLeft++;T.switched=false;return habLog(s,p,"ganha 1 troca de linha extra neste turno.");}
  if(e==="ef"){const to=await chooseMate(s,front(s),energyTarget(s,"T"),`✨ ${p.def.name}: ${hab(p)[3]}`,"Dá 1 energia pra um companheiro da frente. Pra quem?");if(!to)return;const t=enType(s,to);to.en.push({def:{kind:"energy",type:t,name:EN[t]}});return habLog(s,p,`dá energia de ${EN[t]} pra ${to.def.name}.`);}
  const t=ctx.target;if(!t||t==="GOAL")return;const o=other(s);
  if(e==="te"){if(t.en.length){t.en.pop();habLog(s,p,`${t.def.name} perde 1 energia.`);}return;}
  if(e==="ro"){if(!t.en.length)return;const x=t.en.pop(),to=await chooseMate(s,fieldOf(s),energyTarget(s,x.def.type)||p,`✨ ${p.def.name}: ${hab(p)[3]}`,`Roubou energia de ${EN[x.def.type]} de ${t.def.name}. Pra quem vai?`)||p;to.en.push({def:x.def.kind==="energy"?x.def:{kind:"energy",type:x.def.type,name:EN[x.def.type]}});return habLog(s,p,`rouba 1 energia de ${t.def.name} e dá pra ${to.def.name}.`);}
  if(e==="pz"){if(slotOf(o,t)&&inFront(o,t)&&!t.poison){t.poison=true;habLog(s,p,`${t.def.name} ficou pressionado! 😤`);}return;}
  if(e==="mc"){if(slotOf(o,t)){t.para=true;habLog(s,p,`${t.def.name} ficou marcado e não ataca no próximo turno! 🔒`);}return;}
}
/* começo do turno: "it" e quem está atrás com "ef" */
async function habTurnStart(s){
  for(const p of fieldOf(s)){
    const h=hab(p);if(!h)continue;
    if(h[0]==="it")await habApply(s,p,h[1],h[2]);
    if(h[0]==="tr"&&h[1]==="ef"&&T_(s).B.includes(p))await habApply(s,p,"ef",0);
  }
}
/* entrou em campo (também vale pra quem começa escalado) */
function habEnter(s,p){
  const h=hab(p);if(!h)return;
  if(h[0]==="en")habApply(s,p,h[1],h[2]);
  if(h[0]==="p1"&&!p.h1&&(h[1]==="be"||h[1]==="gr")){p.h1=true;if(h[1]==="be")searchEvent(s,p);else{p.free=true;habLog(s,p,"o próximo ataque dele não gasta energia.");}}
}
/* jogador derrubado: segura (Braçadeira), avisa os companheiros, quem derrubou e faz o gol */
async function down(o,t,s,killer){
  if(G.over)return;
  const keep=fieldOf(o).find(q=>q!==t&&habIs(q,"cd","sg")&&!q.h1);
  if(keep){keep.h1=true;t.dmg=t.def.hp-10;habLog(o,keep,`${t.def.name} segura firme e fica com 10 de vida!`);return;}
  const ht=hab(t);
  knockOut(o,t);
  if(killer)log(`${killer.def.name} passou por ${t.def.name} e ficou cara a cara com o goleiro!`,s);
  await goal(s);
  if(!front(o).length)log(`A frente de ${nm(o)} ficou vazia!`,s);
  if(ht&&ht[0]==="sa"){if(ht[1]==="cp")habDraw(o,t,ht[2]||1);else if(ht[1]==="dd")await habDmg(o,t,ht[2]);}
  for(const q of fieldOf(o)){const h=hab(q);if(h&&h[0]==="cd"&&h[1]!=="sg")await habApply(o,q,h[1],h[2]);}
  if(killer&&slotOf(s,killer)){const h=hab(killer);if(h&&h[0]==="de")await habApply(s,killer,h[1],h[2]);}
}
/* Escanteio: quem tem habilidade de escanteio em campo */
async function habCorner(s){
  for(const p of fieldOf(s)){const h=hab(p);if(h&&h[0]==="es")await habApply(s,p,h[1]==="dv"?"dd":h[1],h[2]);}
}
/* moeda escolhida (Paulinho): a primeira moeda que der errado vira certa */
function habCoinSave(s){
  const p=G&&G.phase==="play"&&fieldOf(s).find(q=>habIs(q,"p1","mo")&&!q.h1);
  if(!p)return false;p.h1=true;habLog(s,p,"escolhe o lado da moeda!");return true;
}
/* ================== ESTADO ================== */
let UID=0, G=null;
const inst=d=>({uid:++UID,def:d,dmg:0,en:[],turnIn:-1,buff:0,free:false});
const other=s=>s==="me"?"ai":"me";
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SPEED=()=>G&&G.fast?0.35:1;
const NF=3,NB=2;

function buildDeck(club){
  const d=DECKS[club],cards=[];
  d.players.forEach(k=>cards.push(inst(DEFS[k])));
  d.events.forEach(k=>cards.push(inst(EV[k])));
  return shuffle(cards);
}
const isBasic=c=>c.def.kind==="player"&&!c.def.from;
function newTeam(club){
  const T={club,deck:buildDeck(club),hand:[],discard:[],F:Array(NF).fill(null),B:Array(NB).fill(null),score:0,mull:0,
    coachFired:false,energyLeft:1,escanteio:false,rerollUsed:false,attacked:false,switched:false,swLeft:1,vstarUsed:false};
  for(;;){ // compra 7; sem jogador nenhum, embaralha e compra de novo
    for(let k=0;k<7;k++)draw(T);
    if(T.hand.some(isBasic))break;
    T.deck.push(...T.hand);T.hand=[];shuffle(T.deck);T.mull++;
  }
  return T;
}
function draw(T){if(T.deck.length)T.hand.push(T.deck.shift());}
function startGame(myClub,aiClub,diff){
  G={diff:diff||"medio",half:0,active:"me",phase:"setup",busy:false,sheet:null,log:[],stadium:null,fast:false,over:false,
     t:{me:newTeam(myClub),ai:newTeam(aiClub)}};
  closeOv();
  aiSetup();
  log(`${CLUBS[myClub].name} x ${CLUBS[aiClub].name}. Monte sua escalação: toque nos jogadores da sua mão.`,"big");
  if(T_("me").mull)log(`Sua primeira mão veio sem jogadores, então embaralhei de novo (${T_("me").mull}x).`);
  render();
}
function beginMatch(){
  G.phase="play";log("Apita o árbitro! Começa o jogo e você sai jogando.","big");
  const cc=s=>{const c=CLUBS[T_(s).club];return `<div class="pw"><b>${s==="me"?"Você":"Rival"} · ${c.name}</b><span>${c.coach.name}: ${c.coach.power}</span><small>${c.coach.text}</small>${c.coin?`<small>🪙 Torce pela ${luckTx(s)}.</small>`:""}</div>`;};
  showOv(`<div class="dlg"><h2>${nm("me")} x ${nm("ai")}</h2><p>Os poderes de hoje:</p>${cc("ai")}${cc("me")}<div class="row"><button class="btn p" data-act="kick">Apitar o começo</button></div></div>`);
}

/* ================== REGRAS ================== */
const minute=()=>Math.min(90,Math.round((G.half+1)*4.5));
const T_=s=>G.t[s];
const nm=s=>G&&G.names?G.names[s]:CLUBS[T_(s).club].name;
const coachOn=s=>!T_(s).coachFired;
const front=s=>T_(s).F.filter(Boolean);
const back=s=>T_(s).B.filter(Boolean);
const fieldOf=s=>[...front(s),...back(s)];
function slotOf(s,p){const T=T_(s);let i=T.F.indexOf(p);if(i>=0)return ["F",i];i=T.B.indexOf(p);if(i>=0)return ["B",i];return null;}
const inFront=(s,p)=>T_(s).F.includes(p);
function effCost(move){const c=[...move.cost];if(G&&G.stadium&&G.stadium.def.key==="chuva"&&c.includes("V"))c.push("C");return c;}
function missing(p,move){
  if(p.free)return [];
  const pool=[...p.en.map(e=>e.def.type)],cost=effCost(move),need=[];
  for(const t of cost.filter(x=>x!=="C")){const i=pool.indexOf(t);if(i<0)need.push(t);else pool.splice(i,1);}
  const cn=cost.filter(x=>x==="C").length-pool.length;for(let i=0;i<cn;i++)need.push("C");
  return need;
}
const payable=(p,m)=>missing(p,m).length===0;
/* poderes dos suportes que estão atrás */
const supsOf=(s,k)=>back(s).filter(x=>x.def.sup&&x.def.sup.k===k);
const shieldOf=s=>10*supsOf(s,"guard").length;
const isStar=d=>d.stage==="Ídolo"||!!d.from;
function pay(p,move){
  if(p.free){p.free=false;return true;}
  for(const t of effCost(move)){const i=t==="C"?0:p.en.findIndex(e=>e.def.type===t);if(i>=0&&p.en.length)p.en.splice(i,1);}
  return false;
}
function giveEnergy(s,t,target,why){
  target.en.push({def:{kind:"energy",type:t,name:EN[t]}});
  log(why||`⚡ ${nm(s)} dá energia de ${EN[t]} pra ${target.def.name}.`,s);
}
/* pra quem vai a energia: primeiro quem ainda não consegue atacar (carry antes), depois o carry com menos energia */
function energyTarget(s,t){
  const f=front(s);if(!f.length)return null;
  const need=p=>p.def.moves.some(m=>missing(p,m).length)&&!p.def.moves.some(m=>missing(p,m).length===0);
  const fits=p=>p.def.moves.some(m=>m.cost.includes(t)||m.cost.includes("C"));
  const rank=p=>(need(p)?0:10)+(fits(p)?0:5)+(p.def.role==="C"?0:p.def.role==="S"?1:2)+p.en.length*.1;
  return [...f].sort((a,b)=>rank(a)-rank(b))[0];
}
function bonusOf(s,p,move){
  if(move.kind!=="dmg")return 0;
  let b=p.buff||0;const T=T_(s);
  b+=10*supsOf(s,"bonus").length;
  if(T.escanteio)b+=20+(move.esc||0);
  if(G.stadium&&G.stadium.def.key==="caldeirao"&&G.stadium.owner===s)b+=10;
  if((CLUBS[T.club].base||T.club)==="fla"&&coachOn(s)&&p.def.stage==="Ídolo")b+=10;
  b+=habBonus(s,p);
  return b;
}
/* Quem ataca: só quem está na frente bate; quem está atrás só usa bônus e cura.
   Quem apanha: só a frente do rival. Tanque na frente protege os outros da frente.
   Frente do rival vazia: quem está na frente chuta ao gol. Derrubou, é gol. */
function targets(s,p,move){
  const o=other(s);
  if(move.kind==="buff")return fieldOf(s).filter(x=>x.def.role==="C");
  if(move.kind==="heal")return fieldOf(s).filter(x=>x.dmg>0);
  if(!inFront(s,p)&&!canBack(p))return [];
  const f=front(o);
  if(!f.length)return ["GOAL",...(mechOf(s)==="banco"&&p.def.role==="C"?back(o):[])];
  const tanks=f.filter(x=>x.def.role==="T");
  const snipe=mechOf(s)==="banco"&&p.def.role==="C"?back(o):[];
  return [...(tanks.length?tanks:f),...snipe];
}
const canBack=p=>habIs(p,"p1","as")&&!p.h1;
const canAct=(s,p,m)=>!!slotOf(s,p)&&!p.para&&payable(p,m)&&targets(s,p,m).length>0;
const whyNot=(s,p,m)=>{
  if(!slotOf(s,p))return "Precisa estar em campo.";
  if(p.para)return "Está marcado e não ataca neste turno.";
  if(m.kind==="dmg"&&!inFront(s,p)&&!canBack(p))return "Só ataca quem está na frente.";
  const mi=missing(p,m);if(mi.length)return `Falta energia: ${mi.map(x=>EN[x]).join(", ")}.`;
  if(!targets(s,p,m).length)return m.kind==="dmg"?"Não tem ninguém pra atacar agora.":"Ninguém pra receber isso agora.";
  return "";
};

async function startTurn(side,first){
  G.active=side;G.busy=false;G.sheet=null;const T=T_(side);
  if(first&&!(G.online&&G.online.role==="guest"))for(const s2 of ["me","ai"])fieldOf(s2).forEach(p=>habEnter(s2,p));
  if(!first){draw(T);if(mechOf(side)==="busca"){draw(T);log(`🔎 ${nm(side)} usa a Busca e compra 1 carta a mais.`,side);}}
  for(const p of front(side))if(p.poison&&!G.over){p.dmg+=10;log(`😤 ${p.def.name} está pressionado e perde 10 de vida.`,side);if(p.dmg>=p.def.hp){log(`${p.def.name} não aguentou a pressão!`,other(side));await down(side,p,other(side),null);}}
  if(mechOf(side)==="cura"){const hu=front(side).filter(p=>p.dmg>0).sort((a,b)=>b.dmg-a.dmg)[0];if(hu){hu.dmg=Math.max(0,hu.dmg-20);log(`💚 ${hu.def.name} recupera 20 de vida.`,side);}}
  /* energia do suporte: quem joga escolhe pra quem vai (toca no jogador da frente). O computador dá sozinho. */
  T.supEn=[];
  for(const sp of supsOf(side,"gen")){const t=sp.def.sup.t;
    if(side==="me"||G.online){T.supEn.push({t,from:sp.def.name});log(`⚡ ${sp.def.name} gerou energia de ${EN[t]}. Toque num jogador da frente pra dar.`,side);}
    else{const to=energyTarget(side,t);if(to)giveEnergy(side,t,to,`✨ ${sp.def.name} gera energia de ${EN[t]} pra ${to.def.name}.`);}}
  await habTurnStart(side);
  T.energyLeft=1;T.escanteio=false;T.rerollUsed=false;T.attacked=false;T.switched=false;T.swLeft=mechOf(side)==="recuo"?2:1;
  if(side==="ai"&&G.diff==="dificil"&&!G.online)T.energyLeft=2;
  if(G.half===10)log("⏱️ Intervalo! Começa o segundo tempo.","big");
  render();
  if(side==="ai"&&!G.online){await sleep(700*SPEED());await aiTurn();}
}
function fillFront(s){
  const T=T_(s);
  if(front(s).length||!back(s).length)return;
  const p=[...back(s)].sort((a,b)=>(b.def.role==="T")-(a.def.role==="T"))[0];
  T.B[T.B.indexOf(p)]=null;T.F[T.F.indexOf(null)]=p;
  log(`A frente de ${nm(s)} estava vazia: ${p.def.name} foi obrigado a subir.`,s);
}
async function endTurn(){
  if(G.over)return;
  fillFront(G.active);
  {const T=T_(G.active);for(const x of T.supEn||[]){const to=energyTarget(G.active,x.t);if(to)giveEnergy(G.active,x.t,to,`⚡ Energia de ${x.from} que sobrou foi pra ${to.def.name}.`);}T.supEn=[];}
  for(const p of fieldOf(G.active))p.para=false;
  G.sheet=null;G.half++;G.busy=true;
  if(G.half>=20){render();return finishMatch();}
  await startTurn(other(G.active));
}
function phoneEl(){return document.querySelector(".phone")||document.body;}
const luckOf=()=>"Coroa"; // todo mundo torce pela Coroa: deu Coroa, deu certo
const luckTx=s=>luckOf(s).toUpperCase();
async function flip(side,label){
  let r=Math.random()<.5;if(!r&&habCoinSave(side))r=true;const face=r?luckOf(side):(luckOf(side)==="Cara"?"Coroa":"Cara");
  const el=document.createElement("div");el.className="coin spin";el.textContent="…";phoneEl().appendChild(el);
  netFx({fx:"coin",face});
  await sleep(600*SPEED());el.textContent=face;el.classList.remove("spin");
  await sleep(650*SPEED());el.remove();
  log(`🪙 ${label}: ${face.toUpperCase()}${r?" ✅":" ❌"}`,side);
  return r;
}
/* aviso grande quando o rival joga uma carta */
async function announce(c,txt){
  if(!G||G.phase!=="play")return;
  const el=document.createElement("div");el.className="ann";
  el.innerHTML=`<div class="annIn"><span class="annT">${txt}</span>${bigCard(c)}</div>`;
  phoneEl().appendChild(el);await sleep((G.fast?900:2000));el.remove();
}
async function toast(txt,ms=1200){netFx({fx:"toast",txt,ms});const el=document.createElement("div");el.className="toast";el.textContent=txt;phoneEl().appendChild(el);await sleep(ms*SPEED());el.remove();}

async function act(side,p,move,target,dbl){
  if(G.over)return;
  G.busy=true;G.sheet=null;render();
  const T=T_(side),o=other(side);T.attacked=true;
  if(move.kind==="dmg"&&pay(p,move))log(`⭐ ${p.def.name} usa o ataque grátis e não gasta energia.`,side);
  if(move.kind==="buff"){target.buff+=move.buff;log(`${p.def.name} usa "${move.n}": ${target.def.name} ganha +${move.buff} no próximo ataque.`,side);}
  else if(move.kind==="heal"){target.dmg=Math.max(0,target.dmg-move.heal);log(`${p.def.name} usa "${move.n}": ${target.def.name} recupera ${move.heal} de vida.`,side);}
  else{
    const h=hab(p);
    if(!inFront(side,p)&&canBack(p)){p.h1=true;habLog(side,p,"ataca lá de trás!");}
    let power=move.p+bonusOf(side,p,move),lucky=null;
    if(move.coin){
      let ok=await flip(side,`Moeda de ${p.def.name}`);
      if(!ok&&(CLUBS[T.club].base||T.club)==="pal"&&coachOn(side)&&!T.rerollUsed){T.rerollUsed=true;log("Abel Ferreira pede calma: joga a moeda de novo!",side);ok=await flip(side,"Moeda de novo");}
      if(!ok&&h&&h[1]==="rm"){habLog(side,p,"joga a moeda de novo!");ok=await flip(side,"Moeda de novo");}
      if(ok)power+=move.coin;
      lucky=ok;
    }
    if(h&&h[0]==="ca"&&h[1]!=="rm"&&lucky===null&&target!=="GOAL")lucky=await flip(side,`Habilidade de ${p.def.name}`);
    const caOn=!!(h&&h[0]==="ca"&&lucky);
    if(caOn&&h[1]==="sr"){G.noReact=o;habLog(side,p,"o rival não pode usar Cai-cai nem VAR nesse lance.");}
    if(h&&h[0]==="p1"&&h[1]==="fo"&&!p.h1&&target!=="GOAL"){const left=target.def.hp-target.dmg,pw=power-(target.def.guard||0)-shieldOf(o)-habShield(o,target);
      if((pw<left&&pw+h[2]>=left)||G.half>=16){p.h1=true;power+=h[2];habLog(side,p,`solta o golaço guardado: +${h[2]}!`);}}
    p.buff=0;
    if(dbl&&mechOf(side)==="vstar"&&!T.vstarUsed){T.vstarUsed=true;power*=2;log(`🌟 ${CLUBS[T.club].coach.power}! O ataque vale o dobro.`,side);await toast("Craque!",900);}
    if(target==="GOAL"){log(`${p.def.name} chuta com força ${power}, sem ninguém na frente!`,side);await goal(side);}
    else{
      let dealt=Math.max(0,power-(target.def.guard||0)-shieldOf(o)-habShield(o,target));
      const wasFront=inFront(o,target);
      log(`${p.def.name} usa "${move.n}" em ${target.def.name}: tira ${dealt} de vida.`,side);
      if(target.dmg+dealt>=target.def.hp&&await useReaction(o,"caicai",`${target.def.name} vai ficar sem vida e sair. Usar Cai-cai?`)){
        if(await flip(o,"Cai-cai")){dealt=0;log("🤕 O juiz caiu no cai-cai! Falta, e o ataque não conta.",o);}
        else log("O juiz mandou seguir. Não colou!",o);
      }
      target.dmg+=dealt;
      if(target.dmg>=target.def.hp)await down(o,target,side,p);
      else if(dealt>0){
        if(mechOf(side)==="veneno"&&!target.poison&&wasFront){target.poison=true;log(`😤 ${target.def.name} ficou pressionado!`,side);}
        if(mechOf(side)==="paralisia"&&await flip(side,"Marcação")){target.para=true;log(`🔒 ${target.def.name} ficou marcado e não ataca no próximo turno!`,side);}
      }
      if(dealt>0&&!G.over){
        if(h&&h[0]==="ac")await habApply(side,p,h[1],h[2],{target});
        if(caOn&&h[1]!=="sr")await habApply(side,p,h[1],h[2],{target});
        const ht=hab(target);
        if(ht&&ht[0]==="ap"&&slotOf(o,target)){
          if(ht[1]==="dv"&&slotOf(side,p)){p.dmg+=ht[2];habLog(o,target,`${p.def.name} toma ${ht[2]} de dano de volta.`);if(p.dmg>=p.def.hp)await down(side,p,o,target);}
          else if(ht[1]!=="dv")await habApply(o,target,ht[1],ht[2]);
        }
      }
    }
    p.atk1=true;G.noReact=null;
    if(h&&h[0]==="at"&&slotOf(side,p))await habApply(side,p,h[1],h[2]);
  }
  T.escanteio=false;
  render();await sleep(500*SPEED());
  await endTurn();
}
async function goal(side){
  await toast("GOOOL!");
  if(await useReaction(other(side),"var",`${nm(side)} fez gol. Chamar o VAR?`)){
    if(await flip(other(side),"VAR")){log("📺 VAR anulou o gol!","big");await toast("VAR anulou!",1300);return;}
    log("📺 VAR confirmou: é gol!",other(side));
  }
  T_(side).score++;log(`⚽ GOL de ${nm(side)}! ${score()}`,"big");
}
const score=()=>`${nm("me")} ${T_("me").score} x ${T_("ai").score} ${nm("ai")}`;
function knockOut(side,p){
  const T=T_(side),[l,i]=slotOf(side,p);
  T.discard.push(p);p.en=[];p.free=false;p.poison=false;p.para=false;T[l][i]=null;
  log(`🚑 ${p.def.name} ficou sem vida e saiu de campo.`,side);
}
async function useReaction(side,key,question){
  const T=T_(side),c=T.hand.find(x=>x.def.key===key);if(!c||G.noReact===side)return false;
  const yes=side==="ai"?(G.online?await netAsk(key,question):Math.random()<({facil:.3,dificil:1}[G.diff]||.8)):await ask(EV[key].name,question,c);
  if(yes&&side==="ai"&&!G.online)await announce(c,`🪤 ${nm(side)} usa uma carta de resposta!`);
  if(yes){T.hand.splice(T.hand.indexOf(c),1);T.discard.push(c);log(`${nm(side)} usa ${c.def.name}!`,side);render();}
  return yes;
}

/* ---- ações ---- */
function place(s,c,line){
  const T=T_(s),i=T[line].indexOf(null);if(i<0)return false;
  T.hand.splice(T.hand.indexOf(c),1);c.turnIn=G.half;c.free=isStar(c.def);T[line][i]=c;
  log(`${c.def.name} entra ${line==="F"?"na frente":"atrás"}.`,s);
  if(G.phase==="play")habEnter(s,c);
  if(s==="ai"&&G.phase==="play"&&!G.online)(G.annq=G.annq||[]).push([c,`➕ ${c.def.name} entra ${line==="F"?"na frente":"atrás"} do ${nm(s)}`]);
  return true;
}
const evoTargets=(s,c)=>fieldOf(s).filter(p=>p.def.key===c.def.from&&p.turnIn!==G.half);
function evolve(s,c,target){
  const T=T_(s);T.hand.splice(T.hand.indexOf(c),1);
  const old=target.def;target.def=c.def;target.turnIn=G.half;target.free=true;c.def=old;T.discard.push(c);
  log(`✨ ${old.name} evoluiu: agora é ${target.def.stage}!`,s);
  {const h=hab(target);if(h&&h[0]==="ev")habApply(s,target,h[1],h[2]);}
  if(s==="ai"&&!G.online)(G.annq=G.annq||[]).push([target,`✨ ${old.name} evoluiu!`]);
}
function attach(s,c,target){const T=T_(s);T.hand.splice(T.hand.indexOf(c),1);target.en.push(c);T.energyLeft--;log(`Energia de ${c.def.name} em ${target.def.name}.`,s);}
/* troca de linha: 1 por turno. "with" pode ser outro jogador (troca) ou null (vai pra vaga vazia da outra linha) */
function switchLine(s,p,withP){
  const T=T_(s),[l,i]=slotOf(s,p),ol=l==="F"?"B":"F";
  if(withP){const [l2,j]=slotOf(s,withP);T[l][i]=withP;T[l2][j]=p;log(`🔁 ${p.def.name} e ${withP.def.name} trocam de lugar.`,s);}
  else{const j=T[ol].indexOf(null);T[l][i]=null;T[ol][j]=p;log(`🔁 ${p.def.name} vai ${ol==="F"?"pra frente":"pra trás"}.`,s);}
  T.swLeft--;T.switched=T.swLeft<=0;
  if(T.B.includes(p))p.poison=false;
  if(withP&&T.B.includes(withP))withP.poison=false;
}
function canPlayEvent(s,c){
  const T=T_(s),O=T_(other(s)),k=c.def.key;
  if(k==="mandrake")return front(other(s)).filter(x=>x.def.role==="T").length<=1&&!T.attacked;
  if(k==="diretoria")return O.score<T.score&&!O.coachFired;
  if(k==="massagem")return fieldOf(s).some(p=>p.dmg>0);
  return true;
}
async function playEvent(s,c,target){
  const T=T_(s),O=T_(other(s)),k=c.def.key;
  if(s==="ai")await announce(c,c.def.kind==="stadium"?`🏟️ ${nm(s)} muda o estádio!`:`🃏 ${nm(s)} joga um evento!`);
  else netFx({fx:"ann",d:defId(c.def),txt:c.def.kind==="stadium"?`🏟️ ${nm(s)} muda o estádio!`:`🃏 ${nm(s)} joga um evento!`});
  T.hand.splice(T.hand.indexOf(c),1);
  if(c.def.kind==="stadium"){
    if(G.stadium)T_(G.stadium.owner).discard.push(G.stadium.card);
    G.stadium={card:c,def:c.def,owner:s};log(`🏟️ ${c.def.name} agora vale pros dois times.`,s);render();return;
  }
  T.discard.push(c);log(`${nm(s)} joga ${c.def.name}.`,s);
  if(k==="massagem"){target.dmg=Math.max(0,target.dmg-40);log(`${target.def.name} recuperou 40 de vida.`,s);}
  if(k==="escanteio"){T.escanteio=true;await habCorner(s);}
  if(k==="lancamento"){T.energyLeft++;log("Pode dar mais 1 energia neste turno.",s);}
  if(k==="diretoria"){O.coachFired=true;log(`📉 ${CLUBS[O.club].coach.name} foi demitido! Entra um interino sem poder.`,"big");}
  render();
  if(k==="mandrake"){
    G.busy=true;T.attacked=true;render();
    if(await flip(s,"Pênalti mandrake")){log("O juiz deu o pênalti!",s);await goal(s);}else log("O juiz mandou seguir.",s);
    render();await sleep(400*SPEED());await endTurn();
  }
}

/* ================== COMPUTADOR ================== */
function aiPlace(s){
  const T=T_(s);let n=0;
  for(const c of [...T.hand].filter(isBasic).sort((a,b)=>"TCS".indexOf(a.def.role)-"TCS".indexOf(b.def.role))){
    const r=c.def.role,wantFront=r!=="S";
    if(wantFront&&place(s,c,"F")){n++;continue;}
    if(place(s,c,"B")){n++;continue;}
    if(!front(s).length&&place(s,c,"F"))n++;
  }
  return n;
}
function aiSetup(){aiPlace("ai");fillFront("ai");}
function bestAction(s){
  let best=null,bs=0;const o=other(s);
  for(const p of fieldOf(s))for(const m of p.def.moves){
    if(!payable(p,m)||p.para)continue;
    for(const t of targets(s,p,m)){
      let sc=0;
      if(m.kind==="buff")sc=t.buff?2:20+m.buff/5;
      else if(m.kind==="heal")sc=Math.min(m.heal,t.dmg)*0.6;
      else{
        const exp=m.p+bonusOf(s,p,m)+m.coin*.5;
        if(t==="GOAL")sc=1000;
        else{const left=t.def.hp-t.dmg,dealt=exp-(t.def.guard||0),ko=dealt>=left;
          sc=Math.min(dealt,left)+(ko?80:0)+(ko?900:0);}
      }
      if(sc>bs){bs=sc;best={p,m,t};}
    }
  }
  return best;
}
function aiGive(s){
  const T=T_(s),f=front(s);if(!f.length||T.energyLeft<=0)return false;
  const main=CLUBS[T.club].main||"T";
  let best=null,bs=-Infinity;
  for(const p of f)for(const t of ["T","V"]){
    const need=p.def.moves.some(m=>missing(p,m).length)&&!p.def.moves.some(m=>missing(p,m).length===0);
    const fits=p.def.moves.some(m=>m.cost.includes(t));
    const sc=(need?50:0)+(fits?20:(p.def.moves.some(m=>m.cost.includes("C"))&&t===main?15:0))+(p.def.role==="C"?10:p.def.role==="S"?4:0)-p.en.length*3;
    if(sc>bs){bs=sc;best={p,t};}
  }
  giveEnergy(s,best.t,best.p);T.energyLeft--;return true;
}
async function aiTurn(){
  const s="ai",T=T_(s),wait=async()=>{while(G.annq&&G.annq.length){const [c,t]=G.annq.shift();render();await announce(c,t);}await sleep(650*SPEED());};
  if(aiPlace(s)){render();await wait();}
  for(const c of [...T.hand]){if(c.def.kind==="player"&&c.def.from){const t=evoTargets(s,c);if(t.length){evolve(s,c,t[0]);render();await wait();}}}
  // troca de linha: tira da frente quem está quase caindo, ou sobe um carry de trás
  const weak=front(s).filter(p=>(p.def.hp-p.dmg)<p.def.hp*.3).sort((a,b)=>(a.def.hp-a.dmg)-(b.def.hp-b.dmg))[0];
  const bc=back(s).filter(p=>p.def.role!=="S").sort((a,b)=>(b.def.hp-b.dmg)-(a.def.hp-a.dmg))[0];
  if(weak&&(bc||T.B.includes(null))){switchLine(s,weak,bc||null);render();await wait();}
  else if(bc&&T.F.includes(null)){switchLine(s,bc,null);render();await wait();}
  const mas=T.hand.find(c=>c.def.key==="massagem");
  if(mas){const hurt=fieldOf(s).filter(p=>p.dmg>=40).sort((a,b)=>b.dmg-a.dmg)[0];if(hurt){await playEvent(s,mas,hurt);await wait();}}
  const st=T.hand.find(c=>c.def.kind==="stadium");
  if(st&&(!G.stadium||G.stadium.owner!==s)){await playEvent(s,st);await wait();}
  const dir=T.hand.find(c=>c.def.key==="diretoria");
  if(dir&&canPlayEvent(s,dir)){await playEvent(s,dir);await wait();}
  const lan=T.hand.find(c=>c.def.key==="lancamento");
  if(lan&&front(s).length>1){await playEvent(s,lan);await wait();}
  while(T.energyLeft>0&&!(G.diff==="facil"&&Math.random()<.35)&&aiGive(s)){render();await wait();}
  const man=T.hand.find(c=>c.def.key==="mandrake");
  let a=G.diff==="facil"&&Math.random()<.45?randAction(s):bestAction(s);
  if(man&&canPlayEvent(s,man)&&(!a||a.t!=="GOAL")){await playEvent(s,man);return;}
  if(a){
    const esc=T.hand.find(c=>c.def.key==="escanteio");
    if(esc&&a.m.kind==="dmg"){await playEvent(s,esc);await wait();a=bestAction(s)||a;}
    let dbl=false;
    if(mechOf(s)==="vstar"&&!T.vstarUsed&&a.t!=="GOAL"){const left=a.t.def.hp-a.t.dmg,pw=a.m.p+bonusOf(s,a.p,a.m);dbl=(pw<left&&pw*2>=left)||G.half>=16;}
    await act(s,a.p,a.m,a.t,dbl);return;
  }
  log(`${nm(s)} toca a bola de lado e passa a vez.`,s);
  await wait();await endTurn();
}

/* ================== FIM DE JOGO ================== */
const againAct=()=>G.diff==="treino"||G.online?"newgame":G.diff==="normal"?"m-normal":"m-classic";
async function finishMatch(){
  G.over=true;log("Fim de jogo! "+score(),"big");render();
  let pens=null;
  if(T_("me").score===T_("ai").score){
    await toast("Pênaltis!",1100);
    pens={me:0,ai:0,seq:[]};
    for(let r=0;r<30;r++){
      for(const s of ["me","ai"]){const g=Math.random()<.72;pens[s]+=g?1:0;pens.seq.push(`${nm(s)} ${g?"⚽":"❌"}`);}
      if(r<4){const left=4-r;if(pens.me>pens.ai+left||pens.ai>pens.me+left)break;}
      else if(pens.me!==pens.ai)break;
    }
    log(`Pênaltis: ${nm("me")} ${pens.me} x ${pens.ai} ${nm("ai")}`,"big");
  }
  const me=T_("me").score+(pens?pens.me/100:0),ai=T_("ai").score+(pens?pens.ai/100:0);
  clearMatch();
  if(G.online){G.pens=pens;netSyncNow();setTimeout(()=>netLeave(true),1500);}
  const res=me>ai?"win":me<ai?"loss":"draw",ess=matchReward(T_("me").score,res);
  showOv(`<div class="dlg"><h2>${me>ai?"Vitória!":"Derrota"}</h2>
    <p style="font-size:18px;color:var(--fg)">${score()}</p>
    ${pens?`<p>Nos pênaltis: ${pens.me} x ${pens.ai}</p><p style="font-size:12px">${pens.seq.join(" · ")}</p>`:""}
    ${G.diff==="treino"?`<p>🏋️ Treino: não vale essências. Jogue o Clássico pra ganhar!</p>`:`<div class="essbar"><span>💠 +<b>${ess}</b> essências</span><span>Total: ${COL.ess}</span>${DIFF[G.diff]&&!G.online?`<span>${DIFF[G.diff].ic} ${DIFF[G.diff].n}</span>`:""}</div>`}
    <div class="row"><button class="btn p" data-act="${againAct()}">Jogar de novo</button>${G.diff==="treino"&&!G.online?`<button class="btn s" data-act="m-treino">Outro clássico</button>`:""}<button class="btn s" data-act="${G.online?"c-home":"newgame"}">${G.online?"Pacotes":"Menu"}</button><button class="btn s" data-act="close">Ver o campo</button></div></div>`);
}

function findCard(uid){
  uid=+uid;
  for(const s of ["me","ai"]){const T=T_(s);for(const c of [...T.hand,...fieldOf(s),...T.discard])if(c.uid===uid)return c;}
  if(G.stadium&&G.stadium.card.uid===uid)return G.stadium.card;return null;

const myTurn=()=>G&&G.phase==="play"&&G.active==="me"&&!G.busy&&!G.over;

    const d=c.def,owner=ownerOf(c),onField=!!slotOf(owner,c),inHand=me.hand.includes(c);
    title=d.name;
    const desc=d.kind==="player"?`${ROLEIC[d.role]} ${ROLENAME[d.role]}. ${({T:"Fica na frente pra proteger: enquanto houver tanque na frente, o rival só pode bater nele.",S:`Atrás ele usa o poder dele sozinho, todo turno: ${d.sup?d.sup.tx.replace("Atrás: ",""):""} Na frente ele ataca como os outros.`,C:"É quem bate mais forte. Derrubou alguém, é gol (vale pra qualquer jogador)."})[d.role]}`:d.tx||"";
    body=`<div class="row">${bigCard(c)}<p style="flex:1">${desc}${onField?`<br><br>Está ${inFront(owner,c)?"na <b>frente</b>":"<b>atrás</b>"}.`:""}</p></div>${habBox(d)}`;
    const play=G.phase==="play",can=myTurn();
    if(owner==="me"&&onField&&play){
      d.moves.forEach((m,i)=>{
        const ok=can&&!me.attacked&&canAct("me",c,m),b=bonusOf("me",c,m);
        const what=m.kind==="dmg"?`${m.coin?`Moeda: ${luckTx("me")} soma +${m.coin}. `:""}${m.tx||""}${b?`Bônus agora +${b}.`:""}`:m.tx;
        btns.push(AB(`move" data-i="${i}`,m.n,`${what} ${ok?"":(me.attacked?"Você já atacou.":whyNot("me",c,m))}`,ok?"pri":"",{left:`<span style="display:flex;gap:2px">${effCost(m).map(eDot).join("")}</span>`,val:m.kind==="buff"?"+"+m.buff:m.kind==="heal"?"♥"+m.heal:m.p},!ok));
      });
      if(mechOf("me")==="vstar"&&!me.vstarUsed&&inFront("me",c))d.moves.forEach((m,i)=>{const ok=can&&!me.attacked&&canAct("me",c,m);
        btns.push(AB(`move" data-i="${i}" data-dbl="1`,`🌟 ${m.n} em dobro`,`${CLUBS[me.club].coach.power}: só 1 vez no jogo.`,"",{left:"",val:m.p*2},!ok));});
      if(c.poison)body+=`<p>😤 <b>Pressionado:</b> perde 10 de vida no começo de cada turno seu enquanto estiver na frente. Mandar pra trás tira a pressão.</p>`;
      if(c.para)body+=`<p>🔒 <b>Marcado:</b> não ataca neste turno.</p>`;
      if(can&&inFront("me",c))(me.supEn||[]).forEach((x,i)=>btns.push(AB(`sup" data-i="${i}`,`⚡ Dar a energia de ${x.from}`,`Energia de ${EN[x.t]} gerada pelo suporte.`,"pri",{left:eDot(x.t)})));
      if(can&&me.energyLeft>0)["T","V"].forEach(t=>btns.push(AB(`give" data-t="${t}`,`Dar energia de ${EN[t]}`,"Você ganha 1 energia por turno pra dar a quem quiser.","",{left:eDot(t)})));
      if(c.free)body+=`<p>⭐ <b>Ataque grátis:</b> o próximo ataque dele não gasta energia (bônus de Ídolo e de quem evoluiu).</p>`;
      if(can&&!me.switched){
        const [l]=slotOf("me",c),ol=l==="F"?"B":"F";
        if(me[ol].includes(null))btns.push(AB(`sw" data-w="0`,l==="F"?"⬇️ Mandar pra trás":"⬆️ Subir pra frente","Gasta a troca de linha do turno."));
        me[ol].filter(Boolean).forEach(o=>btns.push(AB(`sw" data-w="${o.uid}`,`🔁 Trocar com ${o.def.name}`,`${o.def.name} vai ${l==="F"?"pra frente":"pra trás"}. Gasta a troca do turno.`)));
      }
    }
    if(inHand){
      const setup=G.phase==="setup",ok=setup||can;
      if(isBasic(c)){
        btns.push(AB(`put" data-l="F`,"⬆️ Colocar na frente","Pode atacar e apanhar.","pri",null,!ok||!me.F.includes(null)));
        btns.push(AB(`put" data-l="B`,"⬇️ Colocar atrás",d.role==="S"?"Protegido, e usa o poder de suporte todo turno.":"Protegido, mas atrás não ataca.","",null,!ok||!me.B.includes(null)));
      }else if(d.kind==="player"){
        const ts=play?evoTargets("me",c):[];
        if(!ts.length)body+=`<p>Pra evoluir, ${DEFS[d.from].name} (${DEFS[d.from].stage}) precisa estar em campo desde antes deste turno.</p>`;
        ts.forEach(t=>btns.push(AB(`evo" data-w="${t.uid}`,`✨ Evoluir ${t.def.name}`,"Mantém a energia e o dano que já levou.","pri",null,!can)));
      }else if(d.kind==="energy"){
        if(setup)body+=`<p>Energia só pode ser ligada depois que a partida começar.</p>`;
        else if(me.energyLeft<=0)body+=`<p>Você já ligou a energia deste turno.</p>`;
        else fieldOf("me").forEach(p=>{const need=p.def.moves.map(m=>missing(p,m)).find(x=>x.length);btns.push(AB(`en" data-w="${p.uid}`,`Ligar em ${p.def.name}`,need?`Falta pra ${p.def.moves.find(m=>missing(p,m).length).n}: ${need.map(x=>EN[x]).join(", ")}`:"Já tem energia pra tudo.","",null,!can));});
      }else if(d.kind==="reaction")body+=`<p>Essa carta é usada na vez do rival. Eu te pergunto na hora certa.</p>`;
      else if(!setup){
        if(d.key==="massagem")fieldOf("me").filter(p=>p.dmg>0).forEach(p=>btns.push(AB(`ev" data-w="${p.uid}`,`💆 Massagem em ${p.def.name}`,`❤️ ${p.def.hp-p.dmg}/${p.def.hp}`,"pri",null,!can)));
        else btns.push(AB(`ev" data-w="0`,`Jogar ${d.name}`,canPlayEvent("me",c)?"":"Agora não dá: "+d.tx,"pri",null,!can||!canPlayEvent("me",c)));
        if(d.key==="massagem"&&!fieldOf("me").some(p=>p.dmg>0))body+=`<p>Ninguém machucado agora.</p>`;
      }
    }
  }
  return `<div class="sheetWrap" data-act="shclose"><div class="sheet" data-stop="1"><div class="grab"></div><h3>${title}</h3>${body}${btns.length?`<div class="btns">${btns.join("")}</div>`:""}<button class="close" data-act="shclose">Fechar</button></div></div>`;
}

/* ================== CLIQUES ================== */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  if(el.classList.contains("sheetWrap")&&e.target.closest("[data-stop]"))return;
  const a=el.dataset.act;
  if(a==="pick"){PICK=el.dataset.club;showPick(true);return;}
  if(a==="rival"){const pool=ORDER().filter(x=>x!==PICK),k=el.dataset.club==="rnd"?pool[rnd(pool.length)]:el.dataset.club;startGame(PICK,k,TREINO?"treino":NORMAL?"normal":"medio");return;}
  if(a==="lore"){showLore(el.dataset.club);return;}
  if(a==="newgame"){if(NET)netLeave(!!(G&&G.over));clearMatch();PICK=null;TREINO=false;NORMAL=false;showPick();return;}
  if(a==="close"){closeOv();return;}
  if(a==="kick"){closeOv();if(G&&G.phase==="play"&&G.half===0&&!G.started){G.started=true;startTurn("me",true);}return;}
  if(a==="back"){showPick(!!PICK);return;}
  if(a==="rules"){showRules();return;}
  if(a==="yes"||a==="no"){if(ASK){const r=ASK;ASK=null;closeOv();r(a==="yes");}return;}
  if(!G)return;
  const sh=G.sheet;
  if(a==="shclose"){G.sheet=null;render();return;}
  if(a==="menu"){G.sheet={kind:"menu"};render();return;}
  if(a==="log"){G.sheet={kind:"log"};render();return;}
  if(a==="info"){G.sheet={kind:"info"};render();return;}
  if(a==="fast"){G.fast=!G.fast;G.sheet=null;render();return;}
  if(a==="card"){G.sheet={kind:"card",uid:+el.dataset.uid};render();return;}
  if(a==="begin"){if(front("me").length){G.sheet=null;if(G.online)return netLocalAct("begin",null,{});beginMatch();}return;}
  if(G.online)return netLocalAct(a,sh,{...el.dataset});
  await runAct("me",a,sh,{...el.dataset});
});

/* ================== PARTIDA SALVA ==================
   O jogo guarda a partida no próprio celular toda vez que é a sua vez.
   Se a página recarregar (ou você fechar sem querer), ela volta de onde parou. */
const SAVE_KEY="brasileirao-partida-v1";
const defId=d=>d.kind==="player"?"P:"+d.key:d.kind==="energy"?"E:"+d.type:"V:"+d.key;
const defFrom=id=>{const [k,v]=[id.slice(0,1),id.slice(2)];return k==="P"?DEFS[v]:k==="E"?{kind:"energy",type:v,name:EN[v]}:EV[v];};
function saveMatch(){
  if(!G||G.over||G.busy||G.online)return;
  if(!(G.phase==="setup"||G.active==="me"))return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({g:G,meu:CLUBS.meu||null,uid:UID},(k,v)=>k==="def"&&v&&v.kind?defId(v):k==="sheet"?null:v));}catch(e){}
}
function clearMatch(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadMatch(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const s=JSON.parse(raw,(k,v)=>k==="def"&&typeof v==="string"?defFrom(v):v);
    if(s.meu)CLUBS.meu=s.meu;
    const g=s.g;if(!g||!g.t||!CLUBS[g.t.me.club]||!CLUBS[g.t.ai.club])return false;
    G=g;UID=Math.max(UID,s.uid||0);G.busy=false;G.sheet=null;G.active="me";
    if(G.stadium){const u=G.stadium.card.uid;G.stadium.def=G.stadium.card.def;void u;}
    return true;
  }catch(e){clearMatch();return false;}
}

/* ================== MODO COLEÇÃO ==================
   Essências 💠: você ganha jogando (vitória, empate, derrota e cada gol).
   Pacote: gasta essências e vem com 5 jogadores de qualquer clube. Carta repetida vira essência.
   Time roubado: você monta 15 jogadores misturando clubes e escolhe o técnico de um deles.
   Tudo fica guardado no próprio celular. */
const COL_KEY="brasileirao-colecao-v1";
const PACK_COST=100,PACK_SLOTS=["D","M","A","A",null],DUP_ESS=20,TEAM_SIZE=15,STAR_CHANCE=.12;
const REWARD={win:100,draw:60,loss:40,goal:10};
const TEAM_TIP={D:5,M:4,A:6};
function colLoad(){
  let s=null;try{s=JSON.parse(localStorage.getItem(COL_KEY));}catch(e){}
  if(!s||!s.cards)s={ess:0,packs:4,cards:{},team:[],coach:null,name:"Time Roubado",stats:{w:0,d:0,l:0}};
  s.team=(s.team||[]).filter(k=>DEFS[k]&&s.cards[k]);
  for(const k of Object.keys(s.cards))if(!DEFS[k])delete s.cards[k];
  return s;
}
let COL=colLoad();
function colSave(){COL.updated=Date.now();try{localStorage.setItem(COL_KEY,JSON.stringify(COL));}catch(e){}if(typeof accPush==="function")accPush();}
const ALL_PLAYERS=Object.values(DEFS).filter(d=>d.kind==="player");
const owned=k=>!!COL.cards[k];
const ownedList=()=>ALL_PLAYERS.filter(d=>owned(d.key));
const rarName=d=>isStar(d)?"Craque":"Comum";

function rollCard(pos){
  const pool=ALL_PLAYERS.filter(d=>!pos||d.pos===pos);
  const stars=pool.filter(isStar),commons=pool.filter(d=>!isStar(d));
  const src=stars.length&&Math.random()<STAR_CHANCE?stars:commons;
  return src[rnd(src.length)];
}
/* modo dono: o criador do jogo (conta "Porps") tem essências e pacotes infinitos */
const DONO="porps";
const isDono=()=>typeof ACC!=="undefined"&&!!ACC&&ACC.key===DONO;
function openPack(){
  if(isDono());else if(COL.packs>0)COL.packs--;else if(COL.ess>=PACK_COST)COL.ess-=PACK_COST;else return null;
  const got=PACK_SLOTS.map(pos=>{
    const d=rollCard(pos),dup=owned(d.key);
    COL.cards[d.key]=(COL.cards[d.key]||0)+1;if(dup)COL.ess+=DUP_ESS;
    return {d,dup};
  });
  colSave();return got;
}

/* ---- time roubado ---- */
const teamDefs=()=>COL.team.map(k=>DEFS[k]);
const roleCount=()=>{const n={D:0,M:0,A:0};teamDefs().forEach(d=>n[d.pos]++);return n;};
const teamClubs=()=>[...new Set(teamDefs().map(d=>d.club))];
function topClub(){const n={};teamDefs().forEach(d=>n[d.club]=(n[d.club]||0)+1);return Object.keys(n).sort((a,b)=>n[b]-n[a])[0]||"pal";}
const coachClub=()=>COL.coach&&teamClubs().includes(COL.coach)?COL.coach:topClub();
function teamIssues(){
  const t=COL.team,iss=[];
  if(t.length<TEAM_SIZE)iss.push(`Faltam ${TEAM_SIZE-t.length} jogadores.`);
  teamDefs().forEach(d=>{if(d.from&&!t.includes(d.from))iss.push(`${d.name} (${d.stage}) é evolução: precisa ter a carta de antes dele no time.`);});
  return iss;
}
const teamOk=()=>teamIssues().length===0;
function autoTeam(){
  const score=d=>d.hp+Math.max(...d.moves.map(m=>m.p+(m.coin||0)/2))*2+(isStar(d)?40:0);
  const fits=d=>!COL.team.includes(d.key)&&(!d.from||COL.team.includes(d.from)||owned(d.from));
  const add=d=>{if(COL.team.length>=TEAM_SIZE||COL.team.includes(d.key))return;if(d.from&&!COL.team.includes(d.from))add(DEFS[d.from]);if(COL.team.length<TEAM_SIZE)COL.team.push(d.key);};
  const n=roleCount();
  for(const pos of ["A","D","M"]){
    const c=ownedList().filter(d=>d.pos===pos&&fits(d)).sort((a,b)=>score(b)-score(a));
    for(const d of c){if(roleCount()[pos]>=TEAM_TIP[pos]||COL.team.length>=TEAM_SIZE)break;add(d);}
  }
  ownedList().filter(fits).sort((a,b)=>score(b)-score(a)).forEach(add);
  void n;colSave();
}
function buildMine(){
  const base=coachClub(),b=CLUBS[base];
  CLUBS.meu=Object.assign({},b,{id:"meu",code:"ROU",name:COL.name||"Time Roubado",base,lore:b.lore,
    blurb:`Time montado por você, com jogadores de ${teamClubs().length} clubes. Técnico: ${b.coach.name} (${b.name}).`});
  DECKS.meu={players:COL.team.slice(),events:DECKS[base].events.slice()};
}

/* ---- prêmio no fim do jogo ---- */
function matchReward(meGoals,res){
  if(G&&G.diff==="treino")return 0;
  const R=(G&&G.diff==="normal"?DIFF.facil:DIFF[G&&G.diff]||DIFF.medio).rew,ess=R[res]+R.goal*meGoals;
  COL.ess+=ess;COL.stats[res==="win"?"w":res==="draw"?"d":"l"]++;colSave();
  return ess;
}

/* ---- telas ---- */

function applyF(list,album){

/* ================== JOGAR ONLINE ==================
   Saguão: quem está online aparece numa lista; você desafia e o amigo aceita.
   Quem desafia é o "dono" da partida: o jogo roda no celular dele, e o do amigo só mostra e manda as jogadas.
   A ponte entre os celulares é o Firebase (Realtime Database), um serviço grátis do Google. */
const FB_CONFIG=/*FIREBASE*/{apiKey:"AIzaSyDEQjg8-2MqQ_Fy2bMRux5UhSoy7MWDPLk",authDomain:"brasileirao-card-game.firebaseapp.com",databaseURL:"https://brasileirao-card-game-default-rtdb.firebaseio.com",projectId:"brasileirao-card-game",storageBucket:"brasileirao-card-game.firebasestorage.app",messagingSenderId:"732930412314",appId:"1:732930412314:web:b02c47c066358fb8de66a3"}/*FIM-FIREBASE*/;
const FB_V="10.12.2";
const NAME_KEY="brasileirao-nome";
let NAME="";try{NAME=localStorage.getItem(NAME_KEY)||"";}catch(e){}
const loadJS=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s);});
const BK={ready:false,uid:null,
  async init(){
    if(this.ready)return;
    if(window.__MOCKBK){Object.assign(this,window.__MOCKBK);await this.start();this.ready=true;return;}
    if(!FB_CONFIG)throw new Error("semconfig");
    for(const m of ["app","auth","database"])await loadJS(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${m}-compat.js`);
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);}catch(e2){}}
    const cr=await firebase.auth().signInAnonymously();this.uid=cr.user.uid;this.db=firebase.database();this.ready=true;
  },
  ref(p){return this.db.ref(p);},
  set(p,v){return this.ref(p).set(v);},
  async get(p){return (await this.ref(p).once("value")).val();},
  push(p,v){return this.ref(p).push(v);},
  remove(p){return this.ref(p).remove();},
  onLeave(p,v){const d=this.ref(p).onDisconnect();return v===undefined?d.remove():d.set(v);},
  cancelLeave(p){return this.ref(p).onDisconnect().cancel();},
  onValue(p,cb){const r=this.ref(p),f=s=>cb(s.val());r.on("value",f);return()=>r.off("value",f);},
  onAdded(p,cb){const r=this.ref(p),f=s=>cb(s.val(),s.key);r.on("child_added",f);return()=>r.off("child_added",f);}
};

async function enterLobby(){
  if(!ACC)return showLogin("Entre na sua conta pra jogar online.");
  if(false){
    const pinEl=document.getElementById("pinIn"),pin=pinEl?pinEl.value.trim():"";
    if(!readName())return showOnline("Coloque seu nick primeiro.");
    if(!/^\d{4}$/.test(pin))return showOnline("O código precisa ter 4 números.");
    showOv(`<div class="dlg"><h2>Conectando…</h2><p>Entrando na sua conta.</p></div>`);
    try{await accLogin(NAME,pin);}catch(e){console.error(e);return showOnline(e.message==="dono"?"Esse nick já tem dono e o código não bate. Confira o código ou escolha outro nick.":e.message==="semconfig"?"O online ainda não foi ligado: falta configurar o Firebase.":`Não consegui conectar. Confira a internet e tente de novo. (${esc(e.code||e.message||"erro")})`);}
  }
  showOv(`<div class="dlg"><h2>Conectando…</h2><p>Entrando no saguão.</p></div>`);
  try{await BK.init();}catch(e){console.error(e);return showOnline(e.message==="semconfig"?"O online ainda não foi ligado: falta configurar o Firebase.":`Não consegui conectar. Confira a internet e tente de novo. (${esc(e.code||e.message||"erro")})`);}
  offAll();LOBBY={};
  const me=`lobby/${BK.uid}`;
  await BK.set(me,{name:NAME,team:teamLabel(ON_TEAM),ts:Date.now()});BK.onLeave(me);
  OFF.push(()=>BK.remove(me));
  OFF.push(BK.onValue("lobby",v=>{LOBBY=v||{};if(!G&&NET===null&&document.getElementById("lobby"))drawLobby();}));
  OFF.push(BK.onAdded(`invites/${BK.uid}`,(v,k)=>{if(v&&!G)gotInvite(v,k);}));
  drawLobby();
}

  const list=Object.entries(LOBBY).filter(([k])=>k!==BK.uid).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  showOv(`<div class="dlg" id="lobby"><h2>Saguão</h2>

const netFx=fx=>{if(G&&G.online&&G.online.role==="host")netSend(Object.assign({k:"fx"},fx));};
function hostStart(room,guest){
  offAll();BK.remove(`lobby/${BK.uid}`);

  G={half:0,active:"me",phase:"setup",busy:false,sheet:null,log:[],stadium:null,fast:false,over:false,
     online:{role:"host"},names:{me:NAME,ai:guest.name||"Rival"},ready:{me:false,ai:false},
     t:{me:newTeam(mine.club),ai:newTeam(gc)}};

}
async function hostGot(m){
  if(!G||!G.online)return;
  if(m.a==="answer"){const r=ASKS[m.id];if(r){delete ASKS[m.id];r(!!m.y);}return;}
  if(m.a==="begin"){netBegin("ai");return;}

}
function netAsk(key,question){
  return new Promise(r=>{const id=Math.random().toString(36).slice(2);ASKS[id]=r;netSend({k:"ask",id,key,question});
    setTimeout(()=>{if(ASKS[id]){delete ASKS[id];r(false);}},25000);});
}
function netBegin(s){
  if(G.phase!=="setup"||!front(s).length)return;
  G.ready[s]=true;log(`${nm(s)} está pronto!`,s);

}
async function guestJoin(room,k){
  offAll();BK.remove(`lobby/${BK.uid}`);BK.remove(`invites/${BK.uid}/${k}`);
  NET={role:"guest",room};ENDED=false;

  OFF.push(BK.onValue(`rooms/${room}/state`,v=>{if(v)installState(v);}));
  OFF.push(BK.onAdded(`rooms/${room}/toG`,v=>{try{guestGot(JSON.parse(v.j));}catch(e){}}));
  OFF.push(BK.onValue(`rooms/${room}/left`,v=>{if(v==="host")friendLeft();}));
}
let ENDED=false;
const swS=x=>x==="me"?"ai":x==="ai"?"me":x;
function installState(str){
  const s=JSON.parse(str,(k,v)=>k==="def"&&typeof v==="string"?defFrom(v):v);
  for(const [k,v] of Object.entries(s.clubs||{}))CLUBS[k]=v;
  const g=s.g,keep=G&&G.online?G.sheet:null;
  g.t={me:g.t.ai,ai:g.t.me};g.active=swS(g.active);
  if(g.stadium)g.stadium.owner=swS(g.stadium.owner);
  (g.log||[]).forEach(l=>l.cls=swS(l.cls));
  g.names={me:g.names.ai,ai:g.names.me};g.ready={me:g.ready.ai,ai:g.ready.me};
  g.online={role:"guest"};G=g;
  G.sheet=keep&&(!keep.uid||findCard(keep.uid))?keep:null;
  if(!document.querySelector(".ov .dlg.keep"))closeOvSilent();
  render();

}

async function guestGot(m){

    const c=G&&T_("me").hand.find(x=>x.def.key===m.key);

function netLeave(finished){

/* jogada de um dos lados (no celular do dono roda pros dois) */
const turnOf=s=>G&&G.phase==="play"&&G.active===s&&!G.busy&&!G.over;
async function runAct(s,a,sh,ds){
  if(!G)return;
  const me=T_(s),local=s==="me";
  if(a==="put"){const c=sh&&findCard(sh.uid);if(c&&me.hand.includes(c)&&(G.phase==="setup"&&!(G.ready&&G.ready[s])||turnOf(s))&&place(s,c,ds.l)){if(local)G.sheet=null;render();}return;}
  if(!turnOf(s))return;
  if(a==="end"){G.busy=true;if(local)G.sheet=null;log(G.online?`${nm(s)} passa a vez.`:"Você passa a vez.",s);await endTurn();return;}
  const c=sh&&sh.uid?findCard(sh.uid):null,w=ds.w?findCard(ds.w):null;
  if(a==="move"){if(!c)return;const m=c.def.moves[+ds.i],dbl=!!ds.dbl;if(!m||!canAct(s,c,m)||me.attacked)return;const ts=targets(s,c,m);
    if(ts.length===1){await act(s,c,m,ts[0],dbl);return;}if(local){G.sheet={kind:"targets",att:c.uid,mi:+ds.i,dbl};render();}return;}
  if(a==="tgt"){const p=findCard(sh.att);if(!p)return;const m=p.def.moves[sh.mi],t=targets(s,p,m)[+ds.i];if(t&&canAct(s,p,m)&&!me.attacked)await act(s,p,m,t,sh.dbl);return;}
  if(a==="sw"){if(c&&!me.switched){switchLine(s,c,w);if(local)G.sheet=null;render();}return;}
  if(a==="evo"){if(c&&w){evolve(s,c,w);if(local)G.sheet=null;render();}return;}
  if(a==="sup"){const x=(me.supEn||[])[+ds.i];if(x&&c&&inFront(s,c)){me.supEn.splice(+ds.i,1);giveEnergy(s,x.t,c,`⚡ ${x.from} dá energia de ${EN[x.t]} pra ${c.def.name}.`);if(local)G.sheet=null;render();}return;}
  if(a==="give"){if(me.energyLeft>0&&c&&slotOf(s,c)){giveEnergy(s,ds.t,c);me.energyLeft--;if(local)G.sheet=null;render();}return;}
  if(a==="en"){if(c&&me.energyLeft>0){attach(s,c,w);if(local)G.sheet=null;render();}return;}
  if(a==="ev"){if(!c||!me.hand.includes(c))return;if(local)G.sheet=null;await playEvent(s,c,w);render();return;}
}
/* toque na tela durante uma partida online */
async function netLocalAct(a,sh,ds){
  if(G.online.role==="host"){if(a==="begin")return netBegin("me");return runAct("me",a,sh,ds);}
  if(a==="begin"){netSend({a:"begin"});return;}
  if(a==="move"&&sh&&sh.uid){const c=findCard(sh.uid),m=c&&c.def.moves[+ds.i];if(m&&targets("me",c,m).length>1){G.sheet={kind:"targets",att:c.uid,mi:+ds.i,dbl:!!ds.dbl};render();return;}}
  if(["put","end","move","tgt","sw","evo","give","sup","en","ev"].includes(a)){G.sheet=null;render();netSend({a,sh,ds});}
}

/* ---- conta pelo nome: nick + código de 4 números, coleção salva na nuvem ----
   No banco fica players/<nick>/<código embaralhado>: quem não sabe o código não acha os dados,
   e ninguém consegue pegar um nick que já tem dono. */
const ACC_KEY="brasileirao-conta";
let ACC=null;try{ACC=JSON.parse(localStorage.getItem(ACC_KEY));}catch(e){}
const nickKey=n=>n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24);
function sha256hex(str){
  const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
  const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(Math.floor(l/2**(i*8))&255);
  let H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
    H=H.map((v,i)=>(v+[a,bb,c,d,e,f,g,h][i])|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("");
}
const accPath=a=>`players/${a.key}/${a.h}`;
async function accLogin(nick,pin){
  const key=nickKey(nick);if(!key)throw new Error("nick");
  if(!/^\d{4}$/.test(pin))throw new Error("pin");
  const a={nick,key,h:sha256hex(`${key}:${pin}:brasileirao-cards`)};
  await BK.init();
  const cloud=await BK.get(accPath(a));
  if(cloud&&cloud.j){const c=JSON.parse(cloud.j);if((c.updated||0)>(COL.updated||0)||!COL.updated){COL=Object.assign(colLoadFrom(c));try{localStorage.setItem(COL_KEY,JSON.stringify(COL));}catch(e){}}}
  else{try{await BK.set(accPath(a),{nick,u:Date.now(),j:JSON.stringify(COL)});}catch(e){throw new Error(/permission/i.test(String(e.code||e.message))?"dono":(e.code||e.message||"erro"));}}
  ACC=a;try{localStorage.setItem(ACC_KEY,JSON.stringify(a));}catch(e){}
  NAME=nick;try{localStorage.setItem(NAME_KEY,NAME);}catch(e){}
  accPush();
}
function colLoadFrom(s){
  s.team=(s.team||[]).filter(k=>DEFS[k]&&s.cards&&s.cards[k]);
  for(const k of Object.keys(s.cards||{}))if(!DEFS[k])delete s.cards[k];
  return s;
}
let accT=null;
function accPush(){
  if(!ACC)return;clearTimeout(accT);
  accT=setTimeout(async()=>{try{await BK.init();await BK.set(accPath(ACC),{nick:ACC.nick,u:Date.now(),j:JSON.stringify(COL)});}catch(e){}},1500);
}
async function accSyncAtStart(){
  if(!ACC||!FB_CONFIG&&!window.__MOCKBK)return;
  try{await BK.init();const cloud=await BK.get(accPath(ACC));
    if(cloud&&cloud.j){const c=JSON.parse(cloud.j);if((c.updated||0)>(COL.updated||0)){COL=colLoadFrom(c);try{localStorage.setItem(COL_KEY,JSON.stringify(COL));}catch(e){}if(!G&&document.querySelector(".ov .dlg"))showPick();return;}}
    accPush();
  }catch(e){}
}

async function doLogin(){

function accLogout(){ACC=null;try{localStorage.removeItem(ACC_KEY);}catch(e){}}
/* ================== MODOS ==================
   Clássico: seu time roubado contra o computador (fácil, médio, difícil), vale essências.
   Treino: qualquer time pronto, só pra testar, não vale essências. */
let TREINO=false,NORMAL=false;
const DIFF={
  facil:{n:"Fácil",ic:"🟢",tx:"O computador erra bastante e quase não usa cartas de resposta.",rew:{win:60,draw:30,loss:15,goal:5}},
  medio:{n:"Médio",ic:"🟡",tx:"O computador joga direitinho.",rew:{win:100,draw:50,loss:25,goal:10}},
  dificil:{n:"Difícil",ic:"🔴",tx:"O computador não perdoa e ganha 2 energias por turno.",rew:{win:180,draw:90,loss:40,goal:15}}
};
/* começo do jogo: prêmio 10x maior. Pra voltar ao normal, troque ESS_X pra 1. */
const ESS_X=10;for(const d of Object.values(DIFF))for(const k in d.rew)d.rew[k]*=ESS_X;
const accLine=()=>ACC?`<p style="font-size:13px">👤 <b style="color:var(--fg)">${esc(ACC.nick)}</b> · cartas salvas na nuvem <button type="button" class="chip" data-act="o-logout">Sair</button></p>`:`<p style="font-size:13px">👤 Jogando sem conta <button type="button" class="chip" data-act="o-logout">Entrar</button></p>`;
function showMenu(){
  G=null;ASK=null;PICK=null;TREINO=false;NORMAL=false;ensureShell();document.getElementById("screen").innerHTML="";
  showOv(`<div class="dlg"><h2>Brasileirão Cards</h2>${accLine()}${essHTML()}
  <div class="modes">
    <button type="button" class="mode hi" data-act="m-classic"><b>⚔️ Clássico</b><small>Seu time roubado contra o computador: fácil, médio ou difícil. Vale essências!</small></button>
    <button type="button" class="mode" data-act="m-normal"><b>⚽ Jogo normal</b><small>Escolha qualquer time pronto e jogue contra o computador. Não precisa de conta nem de pacotes.</small></button>
    <button type="button" class="mode" data-act="o-home"><b>🌐 Online</b><small>Desafie seus amigos que estiverem online.</small></button>
    <button type="button" class="mode" data-act="c-home"><b>🎴 Pacotes e coleção</b><small>Abra pacotes, veja o álbum e monte seu time.</small></button>
    <button type="button" class="mode" data-act="m-treino"><b>🏋️ Treino: Grandes Clássicos</b><small>Mapa do Brasil com os clássicos e a história de cada um. Não vale essências.</small></button>
  </div>
  <div class="row"><button class="btn s" data-act="rules">Como jogar</button></div></div>`);
}
function showClassic(){
  G=null;ensureShell();document.getElementById("screen").innerHTML="";
  if(!teamOk())return showOv(`<div class="dlg"><h2>Clássico</h2>
    <p>Pra jogar o Clássico você precisa de um <b style="color:var(--fg)">time roubado</b> com ${TEAM_SIZE} jogadores. Abra pacotes e monte o seu (tem o botão "Completar sozinho").</p>
    <p class="warn">${teamIssues().join(" ")}</p>
    <div class="row"><button class="btn p" data-act="c-team">Montar time</button><button class="btn s" data-act="c-home">Pacotes</button><button class="btn s" data-act="newgame">Voltar</button></div></div>`);
  const cc=coachClub(),n=roleCount();
  showOv(`<div class="dlg"><h2>Clássico</h2>${essHTML()}
  <p>Seu time: <b style="color:var(--fg)">⭐ ${esc(COL.name)}</b> · 🛡️${n.D} ✨${n.M} ⚔️${n.A} · técnico ${CLUBS[cc].coach.name}. O rival é sorteado entre os 20 clubes.</p>
  <h3 class="sub">Escolha a dificuldade</h3>
  <div class="modes">${Object.entries(DIFF).map(([k,d])=>`<button type="button" class="mode" data-act="m-diff" data-d="${k}"><b>${d.ic} ${d.n}</b><small>${d.tx}</small><small class="rw">Vitória +${d.rew.win} 💠 · empate +${d.rew.draw} · derrota +${d.rew.loss} · +${d.rew.goal} por gol</small></button>`).join("")}</div>
  <div class="row"><button class="btn s" data-act="c-team">Mudar time</button><button class="btn s" data-act="newgame">Voltar</button></div></div>`);
}
/* jogada aleatória do computador no fácil */
function randAction(s){
  const all=[];
  for(const p of fieldOf(s))for(const m of p.def.moves){if(!payable(p,m)||p.para)continue;for(const t of targets(s,p,m))all.push({p,m,t});}
  return all.length?all[rnd(all.length)]:null;
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act^='m-']");if(!el)return;
  const a=el.dataset.act;
  if(a==="m-classic")return showClassic();
  if(a==="m-treino")return showClassicos();
  if(a==="m-normal"){TREINO=false;NORMAL=true;return showPick();}
  if(a==="m-diff"){if(!teamOk())return showClassic();buildMine();const pool=ORDER(),k=pool[rnd(pool.length)];PICK="meu";return startGame("meu",k,el.dataset.d);}
});
